; zenoh-pico を ESP32(Arduino フレームワーク)で動かす PlatformIO プロジェクト。
;
;   1. include/secrets.example.h を include/secrets.h にコピーし、Wi-Fi とルーターのアドレスを書く
;   2. pio run -t upload        (書き込み)
;   3. pio device monitor       (シリアル出力を見る)
;
; 注意: zenoh-pico のビルドスクリプト(extra_script.py)は、ビルド時に PC 上で cmake を実行して
; 設定ヘッダー(config.h)を生成する。そのため PC に CMake と、CMake が使える C/C++ コンパイラが要る
; (Arduino ESP32 向けの設定では C++ も有効になる)。
; Windows なら Visual Studio Build Tools(C++ によるデスクトップ開発)を入れておくと確実。
;
; バッファの大きさは cmake への引数で変えられる(既定は FRAG_MAX_SIZE=4096、BATCH_*_SIZE=2048)。
; メモリが足りずにセッションを開けないときは小さくする。
; board_build.cmake_extra_args = -DBATCH_UNICAST_SIZE=1024 -DFRAG_MAX_SIZE=2048

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico.git#1.10.2
; zenoh-pico のヘッダーを依存解析で見つけられるように deep にする(zenoh-pico の CI と同じ設定)
lib_ldf_mode = deep
build_flags =
    -DZENOH_COMPILER_GCC
    ; 接続できないときは、次の行を有効にすると zenoh-pico のデバッグログがシリアルに出る
    ; -DZENOH_LOG_DEBUG

[env:esp32dev]
; ESP32(無印)の開発ボード。zenoh-pico の README でも ESP32 の DevKit で動作確認されている
platform = espressif32@6.13.0
board = esp32dev

; --- ESP32-C6 / S3 などを使う場合(未検証) ---------------------------------
; ESP32-C6 の Arduino 対応は arduino-esp32 3.x からで、PlatformIO 公式の espressif32 6.x には入っていない。
; コミュニティ版の pioarduino プラットフォームを使えばビルドできる可能性があるが、
; zenoh-pico 1.10.2 との組み合わせはこのテンプレートでは確認していない。
; [env:xiao_esp32c6]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; board = seeed_xiao_esp32c6
