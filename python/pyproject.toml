[project]
name = "zenoh-template-python"
version = "0.1.0"
description = "Zenoh の Python サンプル(pub/sub, query/queryable, ROS 2 連携)"
requires-python = ">=3.9"
dependencies = [
    # ルーターや他言語のライブラリとバージョンをそろえる(1.x どうしなら通信できる)
    "eclipse-zenoh==1.10.2",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
# このディレクトリはパッケージとして配布しないので、ビルドせずに依存だけを入れる
package = false

[tool.ruff]
line-length = 100
target-version = "py39"
